# Hugo + Hextra config for the SecureFetch wiki. Structure follows
# github.com/imfing/hextra-starter-template.

baseURL: https://variably-constant.github.io/SecureFetch/
title: SecureFetch Wiki
locale: en-us
enableRobotsTXT: true
enableGitInfo: true

module:
  hugoVersion:
    extended: true
    min: 0.166.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/Variably-Constant/SecureFetch
      params:
        icon: github

params:
  description: HTTPS from PowerShell over TLS 1.3 with the X25519MLKEM768 post-quantum hybrid key exchange, from rustls inside the module.

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: https://github.com/Variably-Constant/SecureFetch/edit/main/wiki/content

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  toc:
    displayTags: true
